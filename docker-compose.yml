services:
  redis:
    image: redis:7-alpine
    container_name: tara_redis
    ports:
      - "6379:6379"
    restart: always

  backend:
    build: ./backend
    container_name: tara_backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/tara.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./exports_local:/app/exports_local
    restart: always
    healthcheck:
      # 入口脚本先执行 manage.py migrate，健康检查通过才算迁移完成
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      - redis

  celery_worker:
    build: ./backend
    container_name: tara_celery
    command: celery -A app.core.celery_app worker --loglevel=info
    environment:
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=sqlite:////app/data/tara.db
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
      - ./exports_local:/app/exports_local
    restart: always
    depends_on:
      redis:
        condition: service_started
      backend:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: tara_frontend
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      backend:
        condition: service_healthy
